name: Docker Deployment & Runtime Acceptance (M5.7)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  docker-runtime-acceptance:
    name: Docker Runtime Deployment, Observability & Task Verification
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Docker Engine and Docker Compose
        run: |
          docker --version
          docker compose version

      - name: Validate Compose Configuration
        run: |
          docker compose config

      - name: Execute Docker Runtime Acceptance Test Suite
        env:
          AI_BRAIN_LEASE_DURATION: "10"
          AI_BRAIN_HEARTBEAT_INTERVAL: "3"
        run: |
          python scripts/verify_docker_runtime_acceptance.py

      - name: Dump Docker Logs on Failure
        if: failure()
        run: |
          docker compose logs --tail=100

      - name: Run Full ResourceWarning Regression Suite
        run: |
          python -W error::ResourceWarning -m unittest discover -s tests -v

      - name: Run Specific Subsystem Test Suites
        run: |
          python -m unittest tests.test_deployment_observability -v
          python -m unittest tests.test_background_tasks -v
          python -m unittest tests.test_api_endpoints -v
          python -m unittest tests.test_auth_rbac_m5_4 -v
          python -m unittest tests.test_benchmarks -v
