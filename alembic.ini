# Alembic configuration for AI Brain PostgreSQL migrations

[alembic]
script_location = alembic
file_template = %%(rev)s_%%(slug)s
timezone = UTC
prepend_sys_path = .

# Default fallback URL; overridden dynamically in env.py from environment / AI Brain config
sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/ai_brain

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
